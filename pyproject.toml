[project]
name = "warrant"
version = "0.1.0"
description = "Per-mission least-privilege warrants for personal AI agents, enforced by NVIDIA OpenShell."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
  "python-multipart>=0.0.32",
]

[project.scripts]
warrant = "warrant.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warrant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long strings are content; the formatter handles code width

[tool.mypy]
files = ["src/warrant"]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
