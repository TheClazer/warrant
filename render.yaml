# One-click public demo on Render (free plan). Render asks for NEBIUS_API_KEY when you create it.
services:
  - type: web
    name: warrant-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: WARRANT_DAILY_RUN_CAP
        value: "30"
      - key: WARRANT_DAILY_DRAFT_CAP
        value: "30"
      - key: WARRANT_RUN_MAX_MODEL_CALLS
        value: "12"
